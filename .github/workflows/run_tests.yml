name: Run test suite

on:
  pull_request:

  push:
    branches:
      - main

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest]
        # NOTE: If bumping the minimum Python version here, also do it in
        # pyproject.toml, ruff.toml, and other CI files as well.

        # test with oldest and latest supported Python versions
        python-version: ["3.12", "3.14"]
        # test with oldest supported Python version only (for slow tests)
        # python-version: ["3.12"]
        # test with *all* supported Python versions
        # python-version: ["3.12", "3.13", "3.14"]

        jax-version: ["latest"]
        include:
          # test with oldest supported JAX version
          - python-version: "3.12"
            os: ubuntu-latest
            jax-version: "0.7.0"

      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Set up Git repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Restore UV environment
        run: cp production.uv.lock uv.lock

      - name: Install dev requirements
        run: |
          uv sync --extra dev --frozen

      - name: Pin JAX version
        if: matrix.jax-version != 'latest'
        run: |
          uv pip install jax==${{ matrix.jax-version }}

      - name: Run test suite
        run: |
          set -o pipefail
          uv run --no-sync pytest \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage.xml \
            --cov=tesseract_jax

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: pasteurlabs/tesseract-jax
          files: coverage*.xml
          fail_ci_if_error: true

  tests-gpu:
    runs-on: tesseract-ci-gpu

    # Exercise both CUDA major versions so the shim's dlopen loader version
    # fallbacks (libcudart.so.12/.13) and the GPU-direct cuda_ipc path are
    # covered against each. cupy and jax[cudaNN] are pinned to a matching CUDA
    # build so the libcudart the runtime actually binds to differs per entry.
    #
    # Each CUDA leg also pins a Python version so the two legs bracket the
    # supported range (3.12 floor / 3.14 ceiling), which incidentally covers both
    # jaxlib majors (0.7 on <3.14, 0.8 on >=3.14). Newest CUDA rides the newest
    # Python; the floor Python guards the oldest still-supported combination.
    #
    # jax-version brackets the JAX support window on the GPU path too, mirroring
    # the CPU job: each leg tracks latest, and a third leg pins the declared floor
    # (jax==0.7.0) on the CUDA 12 / Python 3.12 combination. The floor is only
    # tested there because 0.7 predates Python 3.14 wheels, so the 3.14 leg cannot
    # install it -- its floor is whatever 0.8 series ships for 3.14.
    #
    # The shim is always compiled against the jaxlib *floor* (pinned in
    # pyproject's [build-system].requires), because XLA's FFI ABI guarantee only
    # runs old-shim-on-newer-runtime. So the floor leg's jaxlib==0.7 runtime is
    # the exact version the shim was built against, and the latest legs exercise
    # that same floor-built shim against a newer jaxlib -- the supported direction.
    strategy:
      fail-fast: false
      matrix:
        cuda:
          - major: "12"
            base_image: "nvidia/cuda:12.8.1-base-ubuntu24.04"
            python-version: "3.12"
            jax-version: "latest"
          - major: "13"
            base_image: "nvidia/cuda:13.3.1-base-ubuntu24.04"
            python-version: "3.14"
            jax-version: "latest"
        include:
          # oldest supported JAX on the CUDA 12 / floor-Python leg
          - cuda:
              major: "12"
              base_image: "nvidia/cuda:12.8.1-base-ubuntu24.04"
              python-version: "3.12"
              jax-version: "0.7.0"

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Set up Git repository
        uses: actions/checkout@v7

      - name: Show GPU info
        run: |
          nvidia-smi
          # Confirm Docker can see the GPU via the NVIDIA container runtime; the
          # GPU tests serve a GPU Tesseract in a subprocess, so a broken runtime
          # must fail loudly here rather than silently skip.
          docker info
          docker run --rm --gpus all ${{ matrix.cuda.base_image }} nvidia-smi

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Build + install the package (this compiles the native FFI shim via the
      # hatch build hook). TESSERACT_JAX_GPU_REQUIRED=1 makes a shim build
      # failure fatal instead of degrading to a pure-Python (CPU-only) install,
      # so the GPU job never runs against a silently-missing shim.
      - name: Install package
        env:
          TESSERACT_JAX_GPU_REQUIRED: "1"
        run: |
          cp production.uv.lock uv.lock
          uv sync --python ${{ matrix.cuda.python-version }} --extra dev --frozen

      # cupy and jax with CUDA support are not declared dependencies (cupy is
      # only needed to *produce* GPU arrays in the test Tesseract's compute, and
      # jax needs a CUDA backend to place arrays on-device); install builds for
      # the matrix CUDA major version into the same environment here. The floor
      # leg pins jax to its declared minimum; latest legs leave it unconstrained.
      - name: Install GPU array frameworks
        run: |
          jax_spec="jax[cuda${{ matrix.cuda.major }}]"
          if [[ "${{ matrix.cuda.jax-version }}" != "latest" ]]; then
            jax_spec="jax[cuda${{ matrix.cuda.major }}]==${{ matrix.cuda.jax-version }}"
          fi
          uv pip install \
            "cupy-cuda${{ matrix.cuda.major }}x" \
            "$jax_spec"

      - name: Show installed CUDA frameworks
        run: |
          uv run --no-sync python -c "import cupy; print('cupy', cupy.__version__, 'runtime', cupy.cuda.runtime.runtimeGetVersion(), 'devices', cupy.cuda.runtime.getDeviceCount())"
          uv run --no-sync python -c "import jax; print('jax', jax.__version__, 'devices', jax.devices())"
          uv run --no-sync python -c "import tesseract_jax.gpu_ffi as g; print('shim available:', g.is_available())"

      - name: Run GPU test suite
        run: |
          set -o pipefail
          uv run --no-sync pytest \
            -v \
            -m gpu \
            --timeout=300 \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage.xml \
            --cov=tesseract_jax \
            --cov-branch

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: pasteurlabs/tesseract-jax
          files: coverage*.xml
          flags: gpu-cuda${{ matrix.cuda.major }}-jax${{ matrix.cuda.jax-version }}
          fail_ci_if_error: true

  all-ok:
    if: always()
    needs: [tests, tests-gpu]

    runs-on: ubuntu-latest

    steps:
      - name: Check for errors
        run: |
          if [[ "${{ needs.tests.result }}" != "success" && "${{ needs.tests.result }}" != "skipped" ]]; then
            echo "Tests failed"
            exit 1
          fi

          if [[ "${{ needs.tests-gpu.result }}" != "success" && "${{ needs.tests-gpu.result }}" != "skipped" ]]; then
            echo "GPU tests failed"
            exit 1
          fi

          echo "All tests passed!"
