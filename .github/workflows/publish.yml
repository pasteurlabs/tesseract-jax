name: Publish

on:
  workflow_dispatch: # Allows manual trigger

  release:
    types:
      - published

jobs:
  # Build every distribution artifact (native manylinux abi3 wheel, sdist,
  # pure-Python fallback wheel) via the reusable workflow.
  build:
    name: "Build distribution"
    uses: ./.github/workflows/build_wheels.yml

  publish:
    name: "Publish distribution"
    if: startsWith(github.ref, 'refs/tags/') # only publish to PyPI on tag pushes
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: pypi
      url: https://pypi.org/p/tesseract-jax

    permissions:
      id-token: write

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v8
        with:
          # Every build leg uploads under a distinct dist-* name (v4+ artifacts
          # are immutable); collapse them into one dist/ directory.
          pattern: ${{ needs.build.outputs.artifact-pattern }}
          merge-multiple: true
          path: dist/

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
