[project]
name = "tesseract-jax"
description = "Tesseract JAX executes Tesseracts as part of JAX programs, with full support for function transformations like JIT, `grad`, and more."
readme = "README.md"
authors = [
    {name = "The tesseract-jax team @ Pasteur Labs", email = "info@simulation.science"},
]
requires-python = ">=3.12,<4"
# TODO: add your dependencies here *and* in requirements.txt
dependencies = [
    "jax>=0.7.0",
    "tesseract-core",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/pasteurlabs/tesseract-jax"

[project.optional-dependencies]
docs = [
    "sphinx",
    "sphinx_autodoc_typehints",
    "furo",
    "myst-nb",
    "sphinx_copybutton",
    "sphinx_design",
    "sphinxext_opengraph",
    "tesseract-core[runtime]",
]
# TODO: add dev dependencies here *and* in requirements-dev.txt
dev = [
    "pre-commit",
    "pytest",
    "pytest-benchmark",
    "pytest-cov",
    "pytest-timeout",
    "typeguard",
    "requests",
    "equinox",
    "tesseract-core[runtime]",
    "tesseract-jax[docs]",
]

[build-system]
requires = [
    "hatchling",
    "hatch-vcs",
    "setuptools-scm!=9.0.0",
    # Build-time deps for the native FFI shim (see hatch_build.py). nanobind
    # provides the binding headers + sources and supports the CPython stable ABI
    # (abi3), so the shim ships as one wheel per platform for all supported
    # CPython versions. jaxlib provides the XLA FFI headers.
    "nanobind>=2.0",
    # The shim builds against jaxlib's XLA FFI headers. XLA guarantees the FFI
    # C API is backward-compatible (old API versions supported >= 12 months, via
    # struct_size), so a shim built against an older jaxlib runs against newer
    # ones -- but not vice versa. Pin to the jaxlib series matching each Python,
    # and bump this deliberately (in step with dropping old JAX support) rather
    # than letting it float.
    "jaxlib==0.7.*; python_version < '3.14'",
    "jaxlib==0.8.*; python_version >= '3.14'",
]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0+unknown"

[tool.hatch.build.hooks.vcs]
version-file = "tesseract_jax/_version.py"

# Compile the native FFI shim for GPU-direct dispatch. Hatchling cannot build
# C/C++ itself, so a custom build hook (hatch_build.py) compiles it.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["tesseract_jax"]
# The native FFI shim is produced by the custom hook into tesseract_jax/ as an
# abi3 module (_cuda_shim.abi3.so / .abi3.pyd).
artifacts = [
    "tesseract_jax/*.so",
    "tesseract_jax/*.pyd",
    "tesseract_jax/*.dylib",
]

[tool.hatch.build.targets.sdist]
include = [
    "tesseract_jax/",
    "hatch_build.py",
    "examples/",
    "requirements.txt",
    "README.md",
    "LICENSE",
]

[tool.pytest.ini_options]
addopts = ["--typeguard-packages=tesseract_jax"]
testpaths = ["tests"]
filterwarnings = [
    "error",
    # ignored by default
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::ImportWarning",
    # raised by Cython, usually harmless
    "ignore:numpy.dtype size changed",
    "ignore:numpy.ufunc size changed",
    # sometimes, dependencies leak resources
    "ignore:.*socket\\.socket.*:pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
branch = true
source = ["tesseract_jax"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
]
ignore_errors = true
omit = [
    "tesseract_jax/_version.py",
]
