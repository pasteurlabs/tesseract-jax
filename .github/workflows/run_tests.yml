name: Run test suite

on:
  pull_request:

  push:
    branches:
      - main

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest]
        # NOTE: If bumping the minimum Python version here, also do it in
        # pyproject.toml, ruff.toml, and other CI files as well.

        # test with oldest and latest supported Python versions
        python-version: ["3.12", "3.14"]
        # test with oldest supported Python version only (for slow tests)
        # python-version: ["3.12"]
        # test with *all* supported Python versions
        # python-version: ["3.12", "3.13", "3.14"]

        jax-version: ["latest"]
        include:
          # test with oldest supported JAX version
          - python-version: "3.12"
            os: ubuntu-latest
            jax-version: "0.7.0"

      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Set up Git repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Restore UV environment
        run: cp production.uv.lock uv.lock

      - name: Install dev requirements
        run: |
          uv sync --extra dev --frozen

      - name: Pin JAX version
        if: matrix.jax-version != 'latest'
        run: |
          uv pip install jax==${{ matrix.jax-version }}

      - name: Run test suite
        run: |
          set -o pipefail
          uv run --no-sync pytest \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage.xml \
            --cov=tesseract_jax

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: pasteurlabs/tesseract-jax
          files: coverage*.xml
          fail_ci_if_error: true

  tests-gpu:
    runs-on: tesseract-ci-gpu

    # Exercise both CUDA major versions so the shim's dlopen loader version
    # fallbacks (libcudart.so.12/.13) and the GPU-direct cuda_ipc path are
    # covered against each. cupy and jax[cudaNN] are pinned to a matching CUDA
    # build so the libcudart the runtime actually binds to differs per entry.
    strategy:
      fail-fast: false
      matrix:
        cuda:
          - major: "12"
            base_image: "nvidia/cuda:12.8.1-base-ubuntu24.04"
          - major: "13"
            base_image: "nvidia/cuda:13.3.1-base-ubuntu24.04"

    defaults:
      run:
        shell: bash -el {0}

    # Fail loudly on any accidental host copy across the FFI boundary (see the
    # residency check in tesseract_jax/_cuda_shim.cc). GPU-direct dispatch must
    # keep data on-device end to end; a host round-trip becomes a hard error.
    env:
      TESSERACT_JAX_DEBUG_CHECK_DEVICE_PTRS: "1"
      # TEMP: diagnostic logging of the CUDA driver context around cuda_ipc decode.
      TESSERACT_JAX_DEBUG_CTX: "1"

    steps:
      - name: Set up Git repository
        uses: actions/checkout@v7

      - name: Show GPU info
        run: |
          nvidia-smi
          # Confirm Docker can see the GPU via the NVIDIA container runtime; the
          # GPU tests serve a GPU Tesseract in a subprocess, so a broken runtime
          # must fail loudly here rather than silently skip.
          docker info
          docker run --rm --gpus all ${{ matrix.cuda.base_image }} nvidia-smi

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Build + install the package (this compiles the native FFI shim via the
      # hatch build hook; the GPU job must NOT set TESSERACT_JAX_GPU_OPTIONAL, so
      # a shim build failure fails the job).
      - name: Install package
        run: |
          cp production.uv.lock uv.lock
          uv sync --python 3.12 --extra dev --frozen

      # cupy and jax with CUDA support are not declared dependencies (cupy is
      # only needed to *produce* GPU arrays in the test Tesseract's compute, and
      # jax needs a CUDA backend to place arrays on-device); install builds for
      # the matrix CUDA major version into the same environment here.
      - name: Install GPU array frameworks
        run: |
          uv pip install \
            "cupy-cuda${{ matrix.cuda.major }}x" \
            "jax[cuda${{ matrix.cuda.major }}]"

      # Workaround (remove once the fix in tesseract-core is released and the
      # lock is bumped): the installed tesseract-core loads libcudart with
      # ctypes.util.find_library / bare sonames, which do not search the pip CUDA
      # wheels (nvidia-cuda-runtime-cuNN, under site-packages/nvidia/*/lib). This
      # runner has no system CUDA toolkit, so the cuda_ipc decode fails to find
      # libcudart. Put the wheel lib dirs on LD_LIBRARY_PATH for every later step
      # -- including the served `tesseract-runtime serve` subprocess, which
      # inherits this environment -- so the loader resolves the bare soname.
      - name: Expose wheel CUDA runtime on LD_LIBRARY_PATH (tesseract-core workaround)
        run: |
          cuda_libs=$(uv run --no-sync python - <<'PY'
          import importlib.util
          from pathlib import Path

          dirs = []
          seen = set()

          def add(p):
              p = str(p)
              if p not in seen and Path(p).is_dir():
                  seen.add(p)
                  dirs.append(p)

          def locations(name):
              try:
                  spec = importlib.util.find_spec(name)
              except (ImportError, ValueError):
                  return ()
              return () if spec is None else (spec.submodule_search_locations or ())

          for loc in locations("nvidia"):
              for lib in Path(loc).glob("*/lib"):
                  if any(lib.glob("libcudart.so*")):
                      add(lib)

          print(":".join(dirs))
          PY
          )
          if [ -z "$cuda_libs" ]; then
            echo "No wheel CUDA runtime dirs found; nothing to add." >&2
          else
            echo "Adding to LD_LIBRARY_PATH: $cuda_libs"
            echo "LD_LIBRARY_PATH=${cuda_libs}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          fi

      - name: Show installed CUDA frameworks
        run: |
          uv run --no-sync python -c "import cupy; print('cupy', cupy.__version__, 'runtime', cupy.cuda.runtime.runtimeGetVersion(), 'devices', cupy.cuda.runtime.getDeviceCount())"
          uv run --no-sync python -c "import jax; print('jax', jax.__version__, 'devices', jax.devices())"
          uv run --no-sync python -c "import tesseract_jax.gpu_ffi as g; print('shim available:', g.is_available())"

      - name: Run GPU test suite
        run: |
          set -o pipefail
          uv run --no-sync pytest \
            -v \
            -s \
            -m gpu \
            --timeout=300 \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage.xml \
            --cov=tesseract_jax \
            --cov-branch

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: pasteurlabs/tesseract-jax
          files: coverage*.xml
          flags: gpu-cuda${{ matrix.cuda.major }}
          fail_ci_if_error: true

  all-ok:
    if: always()
    needs: [tests, tests-gpu]

    runs-on: ubuntu-latest

    steps:
      - name: Check for errors
        run: |
          if [[ "${{ needs.tests.result }}" != "success" && "${{ needs.tests.result }}" != "skipped" ]]; then
            echo "Tests failed"
            exit 1
          fi

          if [[ "${{ needs.tests-gpu.result }}" != "success" && "${{ needs.tests-gpu.result }}" != "skipped" ]]; then
            echo "GPU tests failed"
            exit 1
          fi

          echo "All tests passed!"
