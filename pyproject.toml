[project]
name = "tesseract-jax"
description = "Tesseract JAX executes Tesseracts as part of JAX programs, with full support for function transformations like JIT, `grad`, and more."
readme = "README.md"
authors = [
    {name = "The tesseract-jax team @ Pasteur Labs", email = "info@simulation.science"},
]
requires-python = ">=3.12,<3.15"
# TODO: add your dependencies here *and* in requirements.txt
dependencies = [
    "jax>=0.7.0",
    "tesseract-core",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/pasteurlabs/tesseract-jax"

[project.optional-dependencies]
docs = [
    "sphinx",
    "sphinx_autodoc_typehints",
    "furo",
    "myst-nb",
    "sphinx_copybutton",
    "sphinx_design",
    "sphinxext_opengraph",
    "tesseract-core[runtime]",
]
# TODO: add dev dependencies here *and* in requirements-dev.txt
dev = [
    "pre-commit",
    "pytest",
    "pytest-benchmark",
    "pytest-cov",
    "typeguard",
    "requests",
    "equinox",
    "tesseract-core[runtime]",
    "tesseract-jax[docs]",
]

[build-system]
requires = [
    "hatchling",
    "hatch-vcs",
    "setuptools-scm!=9.0.0",
    # Build-time deps for the native FFI shim (see hatch_build.py). jaxlib
    # provides the XLA FFI headers; pybind11 provides the binding headers.
    "pybind11>=2.12",
    "jaxlib>=0.7.0",
]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "tesseract_jax/_version.py"

# Compile the native FFI shim for GPU-direct dispatch. Hatchling cannot build
# C/C++ itself, so a custom build hook (hatch_build.py) compiles it.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["tesseract_jax", "src/tesseract_jax_gpu"]
# Native shims are produced by the custom hook: the C++ shim (Strategy A) into
# src/tesseract_jax_gpu, and the Rust module (Strategy B) into src/ as a
# top-level module (its name must match the #[pymodule] name).
artifacts = [
    "src/tesseract_jax_gpu/*.so",
    "src/tesseract_jax_gpu/*.pyd",
    "src/tesseract_jax_gpu/*.dylib",
    "src/tesseract_jax_gpu_b.so",
]
force-include = { "src/tesseract_jax_gpu_b.so" = "tesseract_jax_gpu_b.so" }

[tool.hatch.build.targets.sdist]
include = [
    "tesseract_jax/",
    "src/tesseract_jax_gpu/",
    "rust/tesseract_jax_gpu_b/",
    "hatch_build.py",
    "examples/",
    "requirements.txt",
    "README.md",
    "LICENSE",
]

[tool.pytest.ini_options]
addopts = ["--typeguard-packages=tesseract_jax"]
testpaths = ["tests"]
filterwarnings = [
    "error",
    # ignored by default
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::ImportWarning",
    # raised by Cython, usually harmless
    "ignore:numpy.dtype size changed",
    "ignore:numpy.ufunc size changed",
    # sometimes, dependencies leak resources
    "ignore:.*socket\\.socket.*:pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
branch = true
source = ["tesseract_jax"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
]
ignore_errors = true
omit = [
    "tesseract_jax/_version.py",
]
