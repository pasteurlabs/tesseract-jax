coverage:
  status:
    patch:
      default:
        target: auto
        threshold: 0.1%
        informational: false
        only_pulls: false
    project:
      default:
        informational: true
        only_pulls: false
comment:
  layout: "condensed_header, diff, condensed_files, condensed_footer"
  hide_project_coverage: false
ignore:
  - "tesseract_jax/_version.py"
