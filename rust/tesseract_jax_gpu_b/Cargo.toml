[package]
name = "tesseract_jax_gpu_b"
version = "0.1.0"
edition = "2021"
description = "Strategy B: native GIL-free GPU-direct Tesseract dispatch"

[lib]
name = "tesseract_jax_gpu_b"
crate-type = ["cdylib"]

[dependencies]
# Blocking HTTP client, TLS disabled: the Tesseract is plain HTTP on localhost.
ureq = { version = "2", default-features = false }
serde_json = "1"
base64 = "0.22"
libloading = "0.8"
pyo3 = { version = "0.22", features = ["abi3-py312", "extension-module"] }

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
lto = true
